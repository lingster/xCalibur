name: Public repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[notebooks,test]"
      - run: python -m pytest tests
      - run: python tools/check_public.py
      - run: python notebooks/build.py
      - run: python tools/check_public.py
