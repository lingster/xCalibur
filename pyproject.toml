[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xcalibur"
version = "0.1.0"
description = "Exact-first, measurement-driven GPU kernel co-design"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gpu = ["torch"]
search = ["lightgbm"]
retrieval = ["sentence-transformers"]
cute = ["nvidia-cutlass"]
test = ["pytest"]
notebooks = ["pandas", "matplotlib", "nbformat", "nbclient", "ipykernel", "lightgbm"]

[tool.setuptools]
packages = ["xcalibur"]
